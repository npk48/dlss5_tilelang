<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白箱图像管线</title>
<style>body{font:15px system-ui,sans-serif;background:#101721;color:#dee8f3;margin:0}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:24px}section{background:#192431;padding:20px;border-radius:12px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}label{display:flex;flex-direction:column;gap:6px;color:#adc0d4}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #496176;border-radius:6px;background:#101c29;color:#eef5ff}button{cursor:pointer;background:#244e6c}button:disabled{opacity:.45;cursor:default}textarea{width:100%;box-sizing:border-box;font:13px monospace;min-height:180px}small{color:#b8c5d2}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#preview{max-width:100%;max-height:65vh;display:none;background:repeating-conic-gradient(#333 0 25%,#555 0 50%) 0/16px 16px}a{color:#85ceff}progress{width:100%;height:20px}.warn{color:#ffd88b}#error{color:#ffb5b5}.job{padding:8px;cursor:pointer;border-bottom:1px solid #36475a}.inline{flex-direction:row;align-items:center}</style>
<main><h1>白箱时域 + NR 图像管线</h1><div id="model">模型尚未加载</div><small>本地处理 · 固定NR模型 · RGB使用估计guides而非真实几何 · 无运行时下载</small>
<section><div class="grid">
<label>输入类型<select id="kind"><option value="video">视频（流式）</option><option value="images">批量独立图片（逐张reset）</option><option value="sequence">连续图像序列</option></select></label>
<label>文件<input id="files" type="file" multiple></label>
<label>输出高度<input id="height" type="number" min="32" value="540"></label><label>输出宽度<input id="width" type="number" min="32" value="960"></label>
<label>输入编码<select id="encoding"><option>sRGB</option><option>linear</option><option>linear709_nits</option><option>PQ2020</option></select></label>
<label>视频transfer（未标注时需选择）<select id="transfer"><option value="">自动读取标签</option><option value="BT709">明确按BT.709解释</option><option value="sRGB">明确按sRGB解释</option><option value="PQ">PQ/ST.2084</option></select></label>
<label>视频YUV矩阵<select id="matrix"><option value="">自动读取标签</option><option value="bt709">明确BT.709</option><option value="bt601">明确BT.601</option><option value="bt2020">明确BT.2020</option></select></label>
<label>最多视频帧数（空=全部）<input id="limit" type="number" min="1"></label>
<label>NR pass数量<input id="passes" type="number" min="1" max="30" value="1"></label><label>Local Structure<input id="structure" type="number" step=".1" value="2"></label>
<label>NR工作高度（空=输出）<input id="workH" type="number" min="32"></label><label>NR工作宽度（空=输出）<input id="workW" type="number" min="32"></label>
<label>NR差分放大<select id="resample"><option value="bilinear">Bilinear差分</option><option value="easu">EASU差分（仅放大）</option></select></label>
<label>全局输出mix<input id="mix" type="number" min="0" max="1" step=".1" value="1"></label>
<label>假设垂直FOV（度）<input id="fov" type="number" min="1" max="179" value="60"></label>
<label class="inline"><input id="mp4" type="checkbox">额外静音SDR MP4预览</label></div>
<p class="warn">HDR真输出为float NPY；PNG/MP4是SDR预览。MP4不保留alpha/音频；RGBA请用帧序列。连续图片按文件名排序。相机参数是明确假设，不是自动标定。</p>
<div class="row"><button id="generate">生成manifest</button><label class="inline"><input id="advanced" type="checkbox">使用下方manifest（可填写guided、HDR、保护、帧级参数）</label></div>
<textarea id="spec" spellcheck="false"></textarea><p><button id="start">加入任务队列</button></p><div id="error"></div></section>
<section><div class="row"><strong id="jobTitle">尚无任务</strong><button id="cancel" disabled>取消任务</button><button id="reset" disabled>下一帧显式reset</button></div><p id="stage"></p><progress id="progress" max="1" value="0"></progress><p id="counts"></p>
<img id="preview"><div class="row" id="downloads"></div><details><summary>有效设置、分辨率与guide来源</summary><pre id="details"></pre></details></section><section><h3>最近任务</h3><div id="jobs"></div></section></main>
<script>
const $=id=>document.getElementById(id);let active=null,lastPreview='',busy=false;
const number=id=>Number($(id).value);
function manifest(){
 const files=[...$('files').files].sort((a,b)=>a.name.localeCompare(b.name));if(!files.length)throw Error('请选择输入文件');
 const kind=$('kind').value,enc=$('encoding').value;let s={mode:'rgb_estimated',color_encoding:enc,output_size:[number('height'),number('width')],nr_passes:Array.from({length:number('passes')},()=>({structure:number('structure')})),output_settings:{mix:number('mix'),nr_resample:$('resample').value},fsr_settings:{camera_fov_y:number('fov')*Math.PI/180}};
 if($('workH').value||$('workW').value){if(!$('workH').value||!$('workW').value)throw Error('NR工作尺寸需同时填写宽高');s.nr_work_size=[number('workH'),number('workW')];}
 if(kind==='video'){if(files.length!==1)throw Error('视频任务请选择一个文件');s.video={file:files[0].name};if($('transfer').value)s.video.transfer=$('transfer').value;if($('matrix').value)s.video.matrix=$('matrix').value;if($('limit').value)s.video.max_frames=number('limit');}
 else s.frames=files.map((f,i)=>({color:f.name,reset:kind==='images'||i===0}));
 if(enc==='PQ2020'||enc==='linear709_nits')s.color_settings={reference_white_nits:203,peak_nits:4000,output_encoding:enc};
 if($('mp4').checked)s.video_output={file:'preview.mp4',...(kind==='video'?{}:{fps:24})};
 return s;
}
$('generate').onclick=()=>{try{$('spec').value=JSON.stringify(manifest(),null,2);$('error').textContent='';}catch(e){$('error').textContent=e.message;}};
$('transfer').onchange=()=>{if($('transfer').value==='PQ'){$('encoding').value='PQ2020';$('matrix').value='bt2020';}};
$('files').onchange=()=>{let f=$('files').files[0];if(!f)return;const url=URL.createObjectURL(f),media=document.createElement(f.type.startsWith('video/')?'video':'img');const done=()=>{$('width').value=media.videoWidth||media.naturalWidth||960;$('height').value=media.videoHeight||media.naturalHeight||540;URL.revokeObjectURL(url);};media.onload=done;media.onloadedmetadata=done;media.onerror=()=>URL.revokeObjectURL(url);media.src=url;};
async function api(url,options){let r=await fetch(url,options),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j;}
$('start').onclick=async()=>{try{$('start').disabled=true;let s=$('advanced').checked?JSON.parse($('spec').value):manifest();$('spec').value=JSON.stringify(s,null,2);let data=new FormData();data.append('manifest',JSON.stringify(s));for(let f of $('files').files)data.append('files',f,f.name);let j=await api('/api/jobs',{method:'POST',body:data});active=j.id;lastPreview='';$('error').textContent='';await poll();}catch(e){$('error').textContent=e.message;}finally{$('start').disabled=false;}};
for(let action of ['cancel','reset'])$(action).onclick=async()=>{try{await api(`/api/jobs/${active}/${action}`,{method:'POST'});await poll();}catch(e){$('error').textContent=e.message;}};
function link(label,name){let a=document.createElement('a');a.textContent=label;a.href=`/api/jobs/${active}/files/${encodeURIComponent(name)}?download=1`;$('downloads').append(a);}
async function poll(){if(busy)return;busy=true;try{let s=await api('/api/status');$('model').textContent=`NR模型：${s.model_state} · ${s.device}`+(s.load_seconds!=null?` · 加载${s.load_seconds.toFixed(1)}s`:'')+(s.model_error?' · '+s.model_error:'');$('jobs').replaceChildren();for(let j of [...s.jobs].reverse()){let d=document.createElement('div');d.className='job';d.textContent=`${j.id.slice(0,8)} · ${j.status} · ${j.processed_frames}帧`;d.onclick=()=>{active=j.id;lastPreview='';poll();};$('jobs').append(d);}if(!active&&s.jobs.length)active=s.jobs.at(-1).id;if(!active)return;let j=await api('/api/jobs/'+active),terminal=['completed','failed','cancelled'].includes(j.status);$('jobTitle').textContent=`任务 ${j.id.slice(0,8)} · ${j.status}`;$('stage').textContent=j.stage+(j.cancel_requested&&!terminal?' · 等待当前GPU安全边界取消':'')+(j.reset_requested?' · 下一帧将reset':'');$('counts').textContent=`已完成 ${j.processed_frames} 帧`+(j.total_frames_estimate?` / 预计 ${j.total_frames_estimate}`:'')+(j.error?' · '+j.error:'');$('cancel').disabled=terminal;$('reset').disabled=terminal;let n=j.total_frames_estimate||0;$('progress').max=n||1;if(n)$('progress').value=j.processed_frames;else if(terminal)$('progress').value=1;else $('progress').removeAttribute('value');$('details').textContent=JSON.stringify(j.last_frame||j,null,2);$('downloads').replaceChildren();if(j.last_frame){let key=j.id+'/'+j.last_frame.file;if(key!==lastPreview){$('preview').src=`/api/jobs/${j.id}/files/${j.last_frame.file}`;$('preview').style.display='block';lastPreview=key;}link('PNG预览',j.last_frame.file);if(j.last_frame.data_file)link('浮点真输出',j.last_frame.data_file);link('完整帧记录','frames.jsonl');link('报告','report.json');if(j.status==='completed'&&j.video_output_file)link('SDR MP4预览',j.video_output_file);}else{$('preview').style.display='none';lastPreview='';}}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
poll();setInterval(poll,750);
</script></html>
