<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DLSS5 Native</title><style>
:root{color-scheme:dark}body{margin:0;background:#0d141e;color:#e1ebf6;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}h1{font-size:24px;margin:0}small,.muted{color:#9eafc4}.card{padding:20px;background:#182433;border:1px solid #2e4359;border-radius:12px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}label{display:flex;flex-direction:column;gap:7px}input,select,button{font:inherit;border:1px solid #41617e;border-radius:6px;padding:9px;background:#102032;color:inherit}button{background:#25658c;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:15px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;font-size:12px}img{max-width:100%;max-height:65vh}a{color:#8ed3ff}.steps{display:flex;gap:18px;margin:12px 0}.active{color:#87d4ff}#error{color:#ffacac}summary{cursor:pointer}progress{width:100%}</style>
<main><h1>DLSS5 Native</h1><small>原生 CUDA SDK · 本地 API Server · 模型外置</small><div class="card"><div class="grid"><label>图片<input id="image" type="file" accept="image/png,image/jpeg,image/bmp"></label><label>Structure<input id="structure" type="number" value="2" step=".1"></label><label>Tone<input id="tone" type="number" value="1" step=".1"></label><label>输出 Mix<input id="mix" type="number" value="1" min="0" max="1" step=".1"></label></div><details style="margin:16px 0"><summary>高级设置</summary><div class="grid" style="margin-top:12px"><label>输出宽度（0=原图）<input id="width" type="number" value="0" min="0"></label><label>输出高度（0=原图）<input id="height" type="number" value="0" min="0"></label><label>Style<input id="style" type="number" value="1" min="0" max="255"></label><label>皮肤强度<input id="skin" type="number" value="-1" step=".1"></label><label>Pass 数量<input id="passes" type="number" min="1" max="30" value="1"></label><label>模型目录由服务启动参数指定<input disabled value="./model"></label></div><p class="row"><label><span><input id="depth" type="checkbox"> VDA 深度估计</span></label><label><span><input id="flow" type="checkbox"> RAFT 光流</span></label><label><span><input id="guide" type="checkbox"> Guide 验证</span></label><label><span><input id="reconstruction" type="checkbox"> FSR2 时域重建</span></label><label><span><input id="auto" type="checkbox"> 自动 mask</span></label></p><small>单图每次重置历史。连续帧请用 API 的 stream_id 与 reset=false。缺少组件或模型时明确报错，不静默退回。</small></details><button id="run">开始处理</button><span id="error"></span></div>
<div class="card"><div class="steps"><span id="setup">1 加载 / 准备</span><span id="infer">2 推理 / 输出</span></div><p id="status">选择图片后开始</p><progress id="progress" max="1" value="0"></progress><img id="preview" hidden><p><a id="download" hidden download="result.png">下载结果</a></p><details><summary>结果与能力信息</summary><pre id="metrics"></pre><pre id="info"></pre></details></div><small><a href="/v1/openapi.json" target="_blank">API 定义</a> · HTTP 接口上传/下载图片；零拷贝 GPU 集成请使用 DLL C ABI。</small></main>
<script>
const $=x=>document.getElementById(x);let jid=null;
async function req(url,init){const r=await fetch(url,init);const j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
req('/v1/info').then(j=>$('info').textContent=JSON.stringify(j,null,2)).catch(e=>$('error').textContent=e.message);
$('run').onclick=async()=>{try{$('run').disabled=true;$('error').textContent='';const file=$('image').files[0];if(!file)throw Error('请选择图片');const d=new FormData();d.append('image',file);d.append('config',JSON.stringify({structure:+$('structure').value,tone:+$('tone').value,mix:+$('mix').value,style:+$('style').value,skin:+$('skin').value,automatic_mask:$('auto').checked,passes:+$('passes').value,width:+$('width').value,height:+$('height').value,depth:$('depth').checked,flow:$('flow').checked,guide:$('guide').checked,reconstruction:$('reconstruction').checked,reset:true}));jid=(await req('/v1/jobs',{method:'POST',body:d})).id;poll()}catch(e){$('error').textContent=e.message;$('run').disabled=false}};
async function poll(){try{const j=await req('/v1/jobs/'+jid);$('status').textContent=({queued:'排队中',preparing:'加载模型与准备 CUDA kernels',processing:'推理与输出',completed:'完成',failed:'失败'})[j.status]||j.status;$('setup').className=j.status==='preparing'?'active':'';$('infer').className=j.status==='processing'?'active':'';$('metrics').textContent=JSON.stringify(j,null,2);if(j.status==='completed'){$('progress').value=1;const u='/v1/jobs/'+jid+'/result.png';$('preview').src=u;$('preview').hidden=false;$('download').href=u;$('download').hidden=false;$('run').disabled=false}else if(j.status==='failed'){throw Error(j.error)}else{$('progress').removeAttribute('value');setTimeout(poll,500)}}catch(e){$('error').textContent=e.message;$('run').disabled=false}}
</script></html>
